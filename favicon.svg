<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- background: roast-deep -->
  <rect width="32" height="32" rx="7" fill="#43260F"/>
  <!-- coffee bean shape: rotated ellipse -->
  <g transform="rotate(-35 16 16)" fill="none" stroke="#F4E6D5" stroke-width="2.2"
     stroke-linecap="round">
    <ellipse cx="16" cy="16" rx="7" ry="10"/>
  </g>
  <!-- bean crease -->
  <path d="M11.5 20.5 C13.5 17.5 18 13.5 20.5 10.5"
        fill="none" stroke="#F4E6D5" stroke-width="1.8" stroke-linecap="round"/>
  <!-- honey accent dot top-right -->
  <circle cx="25" cy="7" r="3" fill="#D2911F"/>
</svg>